<div style="font-family:Arial,sans-serif;max-width:520px;margin:auto;padding:24px;border:1px solid #eee;border-radius:12px">
  <h2 style="color:#000">{{ config.STORE_NAME }}</h2>
  <p>Hola {{ user.first_name }},</p>
  <p>Recibimos un pedido para restablecer la contraseña de tu cuenta. El enlace es válido por {{ minutes }} minutos.</p>
  <p style="text-align:center;margin:28px 0">
    <a href="{{ link }}" style="background:#000;color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none">Restablecer contraseña</a>
  </p>
  <p style="color:#666;font-size:13px">Si no fuiste vos, ignorá este mensaje: tu contraseña no cambiará.</p>
</div>
